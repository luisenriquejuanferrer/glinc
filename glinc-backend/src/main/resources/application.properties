# Server
server.port=8080

# Database
# Vars de entorno (Spring ${VAR:default}) para que el proyecto arranque
# en cualquier maquina sin tocar el codigo. Si no se exportan, se usan
# los defaults locales (postgres/admin/glinc en localhost).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/glinc}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Bridge
bridge.url=${BRIDGE_URL:http://localhost:3001}
bridge.service-token=${BRIDGE_SERVICE_TOKEN:token-interno-1}

# Las credenciales LibreLink ya NO viven aqui: ahora llegan en el
# body de POST /api/auth/login y solo se usan para abrir la sesion
# en el bridge. El backend no las guarda.

# Swagger UI
springdoc.swagger-ui.path=/docs

# Poller
cgm.poll-interval-ms=90000