<div class="glw-shell">

  <aside class="glw-sidebar">
    <div class="glw-brand">
      <div class="gl-mark">
        <svg width="20" height="20" viewBox="0 0 32 32" fill="none">
          <path d="M27 9.5A12 12 0 1 0 27 22.5"
                stroke="currentColor" stroke-width="3.2"
                stroke-linecap="round" fill="none" opacity="0.35"/>
          <path d="M4 16 L9 16 L11.5 11 L14 21 L16.5 13 L19 18 L22 16 L28 16"
                stroke="currentColor" stroke-width="2.6"
                stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </div>
      <div class="gl-wordmark">glinc<span class="accent">.</span></div>
    </div>

    <div class="glw-nav-section">Trabajo</div>

    <button
      type="button"
      class="glw-nav-item"
      [class.active]="rutaActual === 'workspace'"
      (click)="irA('workspace')">
      <svg class="glw-nav-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1.5"/>
        <rect x="14" y="3" width="7" height="7" rx="1.5"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5"/>
        <rect x="14" y="14" width="7" height="7" rx="1.5"/>
      </svg>
      <span>Pacientes</span>
      <span class="glw-nav-count">{{ numPacientes }}</span>
    </button>

    <div class="glw-nav-section">Sistema</div>

    <button
      type="button"
      class="glw-nav-item"
      [class.active]="rutaActual === 'settings'"
      (click)="irA('settings')">
      <svg class="glw-nav-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 008.5 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H2a2 2 0 010-4h.09A1.65 1.65 0 004.6 8.5a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V2a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H22a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
      </svg>
      <span>Configuración</span>
    </button>

    <button
      type="button"
      class="glw-nav-item"
      [class.active]="rutaActual === 'help'"
      (click)="irA('help')">
      <svg class="glw-nav-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M9.1 9a3 3 0 015.83 1c0 2-3 3-3 3"/>
        <path d="M12 17h.01"/>
      </svg>
      <span>Ayuda</span>
    </button>

    <div class="glw-user-wrap">

      <div class="glw-user-menu" *ngIf="menuUsuarioAbierto">
        <button
          type="button"
          class="glw-user-menu-item"
          (click)="irAConfiguracion()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 008.5 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H2a2 2 0 010-4h.09A1.65 1.65 0 004.6 8.5a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V2a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H22a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
          </svg>
          <span>Configuración de usuario</span>
        </button>
        <button
          type="button"
          class="glw-user-menu-item danger"
          (click)="cerrarSesion()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
            <path d="M16 17l5-5-5-5"/>
            <path d="M21 12H9"/>
          </svg>
          <span>Cerrar sesión</span>
        </button>
      </div>

      <button
        type="button"
        class="glw-user"
        [class.open]="menuUsuarioAbierto"
        (click)="toggleMenuUsuario()">
        <div class="gl-avatar">{{ inicialesUsuario }}</div>
        <div style="flex: 1; min-width: 0;">
          <div class="glw-user-name">{{ nombreUsuario }}</div>
          <div class="glw-user-email">{{ emailUsuario }}</div>
        </div>
        <svg class="glw-user-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 15l-6-6-6 6"/>
        </svg>
      </button>
    </div>
  </aside>

  <div class="glw-main">

    <div class="glw-topbar">
      <h1>{{ tituloPantalla }}</h1>
      <div class="glw-search" *ngIf="rutaActual === 'workspace'">
        <span class="glw-search-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/>
            <path d="M21 21l-4.3-4.3"/>
          </svg>
        </span>
        <input
          type="text"
          placeholder="Buscar paciente por nombre o apellido…"
          [ngModel]="busqueda"
          (ngModelChange)="onBuscar($event)" />
      </div>
      <button
        type="button"
        class="gl-btn gl-btn-ghost glw-topbar-action"
        (click)="abrirModalInvitar()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M19 8v6M22 11h-6"/>
        </svg>
        Invitar paciente
      </button>
    </div>

    <router-outlet></router-outlet>
  </div>

  <div
    class="glw-user-backdrop"
    *ngIf="menuUsuarioAbierto"
    (click)="menuUsuarioAbierto = false">
  </div>

  <app-invite-modal
    *ngIf="modalInvitarAbierto"
    (cerrado)="cerrarModalInvitar()">
  </app-invite-modal>
</div>
